<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png" />
  <title>Frontend Mentor | Browser Extensions Manager UI</title>

  <link rel="stylesheet" href="index.css" />

  <style>
    .attribution {
      font-size: 11px;
      text-align: center;
    }
    .attribution a {
      color: hsl(228, 45%, 44%);
    }
  </style>
</head>

<body>

<main>

  <!-- HEADER -->
  <header class="head">
    <img src="./assets/images/logo.svg" alt="Logo" />
    <img class="fim" src="./assets/images/icon-sun.svg" alt="Theme Toggle" />
  </header>

  <!-- FILTER BAR -->
  <section class="fd">
    <div class="ext">Extensions List</div>
    <div class="up">
      <button class="fb">All</button>
      <button class="sb">Active</button>
      <button class="tb">Inactive</button>
    </div>
  </section>

  <!-- ALL CARDS WRAPPER -->
 <section class="parent-container" id="cards-container"></section>

    <button id="reset-btn">Reset</button>

</main>

<script src="script.js"></script>

</body>
</html>
